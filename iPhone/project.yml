name: Knode
options:
  bundleIdPrefix: com.nyaran
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Knode:
    type: application
    platform: iOS
    sources:
      - Knode
    info:
      path: Knode/Info.plist
      properties:
        CFBundleDisplayName: Knode
        CFBundleName: Knode
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyaran.Knode
        PRODUCT_NAME: Knode
        GENERATE_INFOPLIST_FILE: NO
  KnodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KnodeTests
    dependencies:
      - target: Knode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyaran.KnodeTests
        PRODUCT_NAME: KnodeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Knode.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Knode"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Knode:
    build:
      targets:
        Knode: all
    test:
      targets:
        - KnodeTests
