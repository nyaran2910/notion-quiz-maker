name: ObsidianQuiz
options:
  bundleIdPrefix: com.nyaran
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ObsidianQuiz:
    type: application
    platform: iOS
    sources:
      - ObsidianQuiz
    info:
      path: ObsidianQuiz/Info.plist
      properties:
        CFBundleDisplayName: Knode
        CFBundleName: Knode
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyaran.ObsidianQuiz
        GENERATE_INFOPLIST_FILE: NO
  ObsidianQuizTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ObsidianQuizTests
    dependencies:
      - target: ObsidianQuiz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nyaran.ObsidianQuizTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ObsidianQuiz.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ObsidianQuiz"
        BUNDLE_LOADER: "$(TEST_HOST)"
